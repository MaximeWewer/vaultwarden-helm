{{- include "vaultwarden.validate" . -}}
{{- if not .Values.config.existingSecret }}
{{- $name := include "vaultwarden.secretName" . }}
{{- $s := .Values.config.secrets | default dict }}
{{- $e := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $rsa := include "vaultwarden.resolve" (dict "inline" $s.rsaPrivateKey "existing" $e "key" "rsa-private-key") }}
{{- if not $rsa }}{{- $rsa = genPrivateKey "rsa" }}{{- end }}
{{- $admin := include "vaultwarden.resolve" (dict "inline" $s.adminToken "existing" $e "key" "admin-token") }}
{{- if and .Values.config.admin.enabled (not $admin) }}{{- $admin = randAlphaNum 48 -}}{{- end -}}
{{- $smtp := include "vaultwarden.resolve" (dict "inline" $s.smtpPassword "existing" $e "key" "smtp-password") }}
{{- $push := include "vaultwarden.resolve" (dict "inline" $s.pushInstallationKey "existing" $e "key" "push-installation-key") }}
{{- $sso := include "vaultwarden.resolve" (dict "inline" $s.ssoClientSecret "existing" $e "key" "sso-client-secret") }}
# Chart-managed vaultwarden secrets. Resolution per key: inline config.secrets.* >
# existing in-cluster Secret (lookup) > generated. Provide config.existingSecret in
# production (ESO/Vault), or pin the values inline with ArgoCD.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  # Kept on uninstall: a new RSA key on re-install would log every user out.
  {{- include "vaultwarden.annotations" (dict "root" . "extra" (dict "helm.sh/resource-policy" "keep")) | nindent 2 }}
type: Opaque
stringData:
  rsa-private-key: |
    {{- $rsa | trim | nindent 4 }}
  {{- if $admin }}
  admin-token: {{ $admin | quote }}
  {{- end }}
  {{- if $smtp }}
  smtp-password: {{ $smtp | quote }}
  {{- end }}
  {{- if $push }}
  push-installation-key: {{ $push | quote }}
  {{- end }}
  {{- if $sso }}
  sso-client-secret: {{ $sso | quote }}
  {{- end }}
  {{- if and (eq .Values.database.type "external") .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
  database-url: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}

{{- if and (eq .Values.storage.mode "s3") (not .Values.rustfs.enabled) (not .Values.storage.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.s3.secretName" . }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" dict) | nindent 2 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.storage.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.s3.secretAccessKey | quote }}
{{- end }}

{{- if and .Values.rustfs.enabled .Values.storage.s3.rustfsCreateSecret }}
{{- $rname := .Values.rustfs.secret.existingSecret }}
{{- $re := lookup "v1" "Secret" .Release.Namespace $rname }}
{{- $ak := include "vaultwarden.resolve" (dict "inline" "" "existing" $re "key" "RUSTFS_ACCESS_KEY") | default (printf "vw%s" (randAlphaNum 18 | lower)) }}
{{- $sk := include "vaultwarden.resolve" (dict "inline" "" "existing" $re "key" "RUSTFS_SECRET_KEY") | default (randAlphaNum 40) }}
---
# RustFS root credentials (generate-once), consumed by the rustfs sub-chart through
# rustfs.secret.existingSecret and by vaultwarden as its S3 credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rname }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" (dict "helm.sh/resource-policy" "keep")) | nindent 2 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: {{ $ak | quote }}
  RUSTFS_SECRET_KEY: {{ $sk | quote }}
{{- end }}

{{- if and (include "vaultwarden.backup.anyEnabled" .) (not .Values.backup.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.backup.secretName" . }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" dict) | nindent 2 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.backup.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.backup.s3.secretAccessKey | quote }}
{{- end }}

{{- if include "vaultwarden.backup.filesEnabled" . }}
{{- $pname := printf "%s-restic" (include "vaultwarden.fullname" .) }}
{{- $pe := lookup "v1" "Secret" .Release.Namespace $pname }}
{{- $pw := include "vaultwarden.resolve" (dict "inline" .Values.backup.files.password "existing" $pe "key" "RESTIC_PASSWORD") | default (randAlphaNum 48) }}
---
# restic repository password. SAVE IT outside the cluster: without it the
# repository cannot be decrypted. Kept on uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pname }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" (dict "helm.sh/resource-policy" "keep")) | nindent 2 }}
type: Opaque
stringData:
  RESTIC_PASSWORD: {{ $pw | quote }}
{{- end }}
