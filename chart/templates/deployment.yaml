{{- include "vaultwarden.validate" . -}}
{{- /*
  One pod template, two Deployments:
    server    : the replicas behind the Service. With a scheduler, their job
                scheduler is off (JOB_POLL_INTERVAL_MS=0).
    scheduler : single pod, no traffic (not selected by the Service), the only one
                running the scheduled jobs (purges, 2FA / emergency-access mails),
                so a multi-replica install does not send every mail N times.
*/ -}}
{{- $components := list "server" }}
{{- if include "vaultwarden.scheduler.enabled" . }}
{{- $components = append $components "scheduler" }}
{{- end }}
{{- range $component := $components }}
{{- $r := $ }}
{{- $isServer := eq $component "server" }}
{{- $mode := $r.Values.storage.mode }}
{{- $replicas := int (include "vaultwarden.replicas" $r) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $isServer | ternary (include "vaultwarden.fullname" $r) (printf "%s-scheduler" (include "vaultwarden.fullname" $r)) }}
  labels:
    app.kubernetes.io/component: {{ $component }}
    {{- include "vaultwarden.labels" $r | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" $r "extra" dict) | nindent 2 }}
spec:
  {{- if $isServer }}
  {{- if not (and $r.Values.autoscaling.enabled (include "vaultwarden.multiPod" $r)) }}
  replicas: {{ $replicas }}
  {{- end }}
  {{- else }}
  replicas: 1
  {{- end }}
  revisionHistoryLimit: 5
  {{- if or (not $isServer) (eq $mode "rwo") (eq $r.Values.database.type "sqlite") }}
  # Single writer (RWO volume / sqlite file) or single scheduler: never two pods at once.
  strategy:
    type: Recreate
  {{- else }}
  # Shared data store: zero-downtime rolling update.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
      {{- include "vaultwarden.selectorLabels" $r | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $component }}
        {{- include "vaultwarden.selectorLabels" $r | nindent 8 }}
        {{- with $r.Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $r.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $r.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vaultwarden.serviceAccountName" $r }}
      automountServiceAccountToken: {{ $r.Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $r.Values.terminationGracePeriodSeconds }}
      {{- with $r.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $r.Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with $r.Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $r.Values.podSecurityContext | nindent 8 }}
      {{- $waitS3 := and (eq $mode "s3") $r.Values.storage.s3.waitForBucket }}
      {{- if or $waitS3 $r.Values.extraInitContainers }}
      initContainers:
      {{- if $waitS3 }}
        # Block until the bucket answers: vaultwarden reads S3 objects (config.json)
        # at startup and silently skips them when S3 is not reachable yet.
        - name: wait-for-s3
          image: {{ include "vaultwarden.image" (dict "img" $r.Values.backup.files.rclone.image "root" $r) | quote }}
          imagePullPolicy: {{ $r.Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until rclone lsf {{ printf "vw:%s" $r.Values.storage.s3.bucket | quote }} --max-depth 1 >/dev/null 2>&1; do
                echo "waiting for S3 bucket {{ $r.Values.storage.s3.bucket }}"; sleep 5
              done
          env:
            {{- include "vaultwarden.rclone.env" $r | nindent 12 }}
          securityContext:
            {{- toYaml $r.Values.containerSecurityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      {{- with $r.Values.extraInitContainers }}
        {{- include "vaultwarden.tplValue" (dict "value" . "root" $r) | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: vaultwarden
          image: {{ include "vaultwarden.appImage" $r | quote }}
          imagePullPolicy: {{ $r.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $r.Values.containerSecurityContext | nindent 12 }}
          env:
            {{- if and $isServer (include "vaultwarden.scheduler.enabled" $r) }}
            # Scheduled jobs run in the dedicated scheduler pod only.
            - name: JOB_POLL_INTERVAL_MS
              value: "0"
            {{- end }}
            {{- include "vaultwarden.env" $r | nindent 12 }}
          {{- with $r.Values.config.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $r.Values.containerPort }}
              protocol: TCP
          # Defaults in values.yaml (probes.*): readiness on /alive (also checks the DB),
          # liveness TCP only so a DB outage does not restart every pod.
          {{- with $r.Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $r.Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $r.Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml ($isServer | ternary $r.Values.resources $r.Values.scheduler.resources) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rsa-key
              mountPath: /etc/vaultwarden/rsa
              readOnly: true
            # Rocket/Diesel scratch (read-only root filesystem).
            - name: tmp
              mountPath: /tmp
            {{- with $r.Values.extraVolumeMounts }}
            {{- include "vaultwarden.tplValue" (dict "value" . "root" $r) | nindent 12 }}
            {{- end }}
        {{- with $r.Values.sidecars }}
        {{- include "vaultwarden.tplValue" (dict "value" . "root" $r) | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if eq $mode "s3" }}
          # Per-pod scratch: tmp uploads + icon cache. Shared objects live in S3.
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "vaultwarden.pvcName" $r }}
          {{- end }}
        - name: rsa-key
          secret:
            secretName: {{ include "vaultwarden.secretName" $r }}
            defaultMode: 0440
            items:
              - key: rsa-private-key
                path: rsa_key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        {{- with $r.Values.extraVolumes }}
        {{- include "vaultwarden.tplValue" (dict "value" . "root" $r) | nindent 8 }}
        {{- end }}
      {{- if and $isServer $r.Values.topologySpread.enabled (include "vaultwarden.multiPod" $r) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ $r.Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
              {{- include "vaultwarden.selectorLabels" $r | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
              {{- include "vaultwarden.selectorLabels" $r | nindent 14 }}
      {{- end }}
      {{- with $r.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
