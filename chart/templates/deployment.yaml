{{- include "vaultwarden.validate" . -}}
{{- $mode := .Values.storage.mode }}
{{- $replicas := int (include "vaultwarden.replicas" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultwarden.fullname" . }}
  labels:
    app.kubernetes.io/component: server
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" dict) | nindent 2 }}
spec:
  {{- if not (and .Values.autoscaling.enabled (include "vaultwarden.multiPod" .)) }}
  replicas: {{ $replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  {{- if or (eq $mode "rwo") (eq .Values.database.type "sqlite") }}
  # Single writer on a RWO volume / sqlite file: never two pods at once.
  strategy:
    type: Recreate
  {{- else }}
  # Shared data store: zero-downtime rolling update.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      {{- include "vaultwarden.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        {{- include "vaultwarden.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vaultwarden.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $waitS3 := and (eq $mode "s3") .Values.storage.s3.waitForBucket }}
      {{- if or $waitS3 .Values.extraInitContainers }}
      initContainers:
      {{- if $waitS3 }}
        # Block until the bucket answers: vaultwarden reads S3 objects (config.json)
        # at startup and silently skips them when S3 is not reachable yet.
        - name: wait-for-s3
          image: {{ include "vaultwarden.image" (dict "img" .Values.backup.files.rclone.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until rclone lsf {{ printf "vw:%s" .Values.storage.s3.bucket | quote }} --max-depth 1 >/dev/null 2>&1; do
                echo "waiting for S3 bucket {{ .Values.storage.s3.bucket }}"; sleep 5
              done
          env:
            {{- include "vaultwarden.rclone.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      {{- with .Values.extraInitContainers }}
        {{- include "vaultwarden.tplValue" (dict "value" . "root" $) | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: vaultwarden
          image: {{ include "vaultwarden.appImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "vaultwarden.env" . | nindent 12 }}
          {{- with .Values.config.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # Defaults in values.yaml (probes.*): readiness on /alive (also checks the DB),
          # liveness TCP only so a DB outage does not restart every pod.
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rsa-key
              mountPath: /etc/vaultwarden/rsa
              readOnly: true
            # Rocket/Diesel scratch (read-only root filesystem).
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- include "vaultwarden.tplValue" (dict "value" . "root" $) | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- include "vaultwarden.tplValue" (dict "value" . "root" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if eq $mode "s3" }}
          # Per-pod scratch: tmp uploads + icon cache. Shared objects live in S3.
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "vaultwarden.pvcName" . }}
          {{- end }}
        - name: rsa-key
          secret:
            secretName: {{ include "vaultwarden.secretName" . }}
            defaultMode: 0440
            items:
              - key: rsa-private-key
                path: rsa_key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        {{- with .Values.extraVolumes }}
        {{- include "vaultwarden.tplValue" (dict "value" . "root" $) | nindent 8 }}
        {{- end }}
      {{- if and .Values.topologySpread.enabled (include "vaultwarden.multiPod" .) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
              {{- include "vaultwarden.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
              {{- include "vaultwarden.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
