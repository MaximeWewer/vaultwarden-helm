{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vaultwarden.fullname" . }}
  labels:
    app.kubernetes.io/component: server
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" .Values.httpRoute.annotations) | nindent 2 }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if include "vaultwarden.rustfs.routed" . }}
    # Bundled RustFS, path-style S3 on the vault origin (see ingress.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /{{ .Values.storage.s3.bucket }}/
      backendRefs:
        - name: {{ include "vaultwarden.rustfs.host" . }}
          port: 9000
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "vaultwarden.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
