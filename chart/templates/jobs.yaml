{{- if and (eq .Values.storage.mode "s3") (or .Values.storage.s3.createBucket .Values.rustfs.enabled) }}
{{- $spec := include "vaultwarden.job.bucket.spec" . }}
# Creates the vaultwarden bucket (idempotent). Plain Job, not a hook, so it behaves
# the same under Helm and Argo CD. No TTL: a finished Job stays (Argo sees it Healthy
# instead of re-creating it). Its name hashes the whole spec, so any change (bucket,
# endpoint, image...) yields a new Job instead of an immutable-field update error.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-bucket-%s" (include "vaultwarden.fullname" .) ($spec | sha256sum | trunc 8) | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/component: bucket-init
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" dict) | nindent 2 }}
spec:
  {{- $spec | nindent 2 }}
{{- end }}

{{- if and (include "vaultwarden.backup.filesEnabled" .) .Values.backup.files.restore.enabled }}
---
{{- $spec := include "vaultwarden.job.restore.spec" . }}
# One-shot restic restore. Scale vaultwarden to 0 first, disable afterwards. Name
# hashes the spec (snapshot, images...): a change runs a new restore.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-restore-%s" (include "vaultwarden.fullname" .) ($spec | sha256sum | trunc 8) | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/component: restore
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" dict) | nindent 2 }}
spec:
  {{- $spec | nindent 2 }}
{{- end }}
