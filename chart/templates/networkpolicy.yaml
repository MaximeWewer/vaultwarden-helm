{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultwarden.fullname" . }}
  labels:
    app.kubernetes.io/component: server
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- include "vaultwarden.annotations" (dict "root" . "extra" dict) | nindent 2 }}
spec:
  # Vaultwarden pods only: server + scheduler (CNPG / RustFS manage their own pods).
  podSelector:
    matchLabels:
      {{- include "vaultwarden.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, scheduler]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Web vault / API / WebSocket from the declared sources (ingress controller,
    # gateway). Empty allowedFrom = any pod in any namespace, web port only.
    - from:
        {{- with .Values.networkPolicy.allowedFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if or (eq .Values.database.type "cnpg") .Values.rustfs.enabled }}
    # In-namespace deps:{{ if eq .Values.database.type "cnpg" }} CNPG (5432){{ end }}{{ if .Values.rustfs.enabled }} RustFS (9000){{ end }}.
    - to:
        - podSelector: {}
      ports:
        {{- if eq .Values.database.type "cnpg" }}
        - protocol: TCP
          port: 5432
        {{- end }}
        {{- if .Values.rustfs.enabled }}
        - protocol: TCP
          port: 9000
        {{- end }}
    {{- end }}
    {{- if eq .Values.database.type "external" }}
    # External database (externalDatabase.port), in or out of the cluster.
    - to:
        {{- with .Values.externalDatabase.networkPolicyPeers }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        {{- include "vaultwarden.netpol.anywhere" . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.externalDatabase.port }}
    {{- end }}
    {{- if eq .Values.storage.mode "s3" }}
    {{- $ep := include "vaultwarden.s3.endpoint" . | default "https://s3.amazonaws.com" }}
    # S3 endpoint {{ $ep }}{{ if include "vaultwarden.rustfs.routed" . }} (vault origin: hairpin through the ingress to RustFS){{ end }}.
    - to:
        {{- include "vaultwarden.netpol.anywhere" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "vaultwarden.urlPort" $ep }}
    {{- end }}
    {{- if .Values.networkPolicy.allowInternetHttps }}
    # Icons, push relay, SSO IdP: HTTPS to anything (SMTP below).
    - to:
        {{- include "vaultwarden.netpol.anywhere" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.config.smtp.host }}
    - to:
        {{- include "vaultwarden.netpol.anywhere" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.smtp.port }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
