name: Build vaultwarden-s3 image

# The official vaultwarden/server image is built without the `s3` cargo feature, so
# storage.mode=s3 needs this image: same upstream sources and docker/Dockerfile.alpine,
# built with DB=sqlite,mysql,postgresql,enable_mimalloc,s3 (upstream alpine default + s3).
# Version is ALWAYS chart/Chart.yaml appVersion (lockstep with the chart), tag
# "<appVersion>-alpine" like the official alpine image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - chart/Chart.yaml
      - .github/workflows/build-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version (Chart.yaml appVersion)
        id: v
        run: |
          VERSION=$(grep '^appVersion:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "tag=${VERSION}-alpine" >> $GITHUB_OUTPUT
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${OWNER}/vaultwarden-s3" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Image already published, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout vaultwarden
        if: steps.exists.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: dani-garcia/vaultwarden
          ref: ${{ steps.v.outputs.version }}
          path: vaultwarden

      - name: Set up QEMU
        if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: vaultwarden
          file: vaultwarden/docker/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DB=sqlite,mysql,postgresql,enable_mimalloc,s3
            VW_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.title=vaultwarden-s3
            org.opencontainers.image.description=Vaultwarden ${{ steps.v.outputs.version }} built with the s3 feature
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
